<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="850" viewBox="0 0 1320 850" role="img" aria-labelledby="title desc">
<title id="title">CONS 애플리케이션 아키텍처</title><desc id="desc">BLE 비콘 신호를 Android에서 수집하고 위치를 계산. Retrofit으로 Spring Boot 서버와 비콘 좌표 교환. Android는 Unity AR 길안내와 사용자 좌표 연동, Room에서 역·노선도 조회. 서버는 MySQL에 비콘 정보 저장.</desc>
