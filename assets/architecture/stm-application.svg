<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="880" viewBox="0 0 1320 880" role="img" aria-labelledby="title desc" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
<title id="title">STM-Simulator 애플리케이션 아키텍처</title><desc id="desc">Electron 앱의 격리된 Renderer에서 IDE 작업 화면과 회로 편집을 제공하고, C 인터프리터 회로 시뮬레이터와 Cortex-M4 펌웨어 에뮬레이터가 같은 회로 모델을 구동. Preload의 제한된 IPC로 Main 프로세스가 프로젝트 파일 저장, ARM GCC·GDB 도구, GitHub Release 자동 업데이트를 처리.</desc>
