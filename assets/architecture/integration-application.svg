<title id="title">CMP 애플리케이션 아키텍처</title><desc id="desc">React 화면이 Spring WebFlux API를 호출. 로그인·세션은 NSS 토큰을 관리하고, 조회 API가 WebClient로 NSS·NBU API를 비동기 호출한 뒤 테넌트·cluster·namespace 매핑 필터로 응답을 구분. 파일 배포는 경로를 검증해 설치 파일 폴더를 ZIP으로 제공.</desc>
