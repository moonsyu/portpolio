<title id="title">BOOKIES 애플리케이션 아키텍처</title><desc id="desc">Web Browser와 Android App이 EC2의 Spring Boot Web Service에 JSP·REST API로 접속하고, Web Service는 JDBC로 RDS Oracle 19c에 연결. 팀원이 구현한 DRM의 Packager가 암호화 전자책을 S3에 올리고 Distributor가 URL·키를 DRM Agent에 전달.</desc>
