<title id="title">Arabica 애플리케이션 아키텍처</title><desc id="desc">React 화면이 Spring Boot API를 호출. 정책·예약이 비동기 실행기를 거쳐 SSH·Bash로 운영 서버 덤프를 실행하고, scp로 받은 결과 파일을 5분 주기로 판독해 DR 저장소에서 업로드·복원 검증. 인증 상태는 Redis, 정책·이력은 MariaDB에 저장.</desc>
