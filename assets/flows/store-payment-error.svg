<text x="720" y="515.38" text-anchor="middle" class="" font-size="26"><tspan x="720" dy="0">error_code ·</tspan><tspan x="720" dy="37.699999999999996">error_message 추출</tspan></text>
<path class="edge" d="M720 580 L720 640"/>
<rect x="560" y="640" width="320" height="96" rx="48" fill="#f8fafc" stroke="#c5d2e6" stroke-width="2"/>
