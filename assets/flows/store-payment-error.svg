<svg xmlns="http://www.w3.org/2000/svg" width="960" height="930" viewBox="0 0 960 930" role="img" aria-labelledby="title"><title id="title">Store: Wallet 결제 실패 응답을 최상위 오류 필드에서 읽도록 바꾼 흐름</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2355de"/></marker></defs><rect width="960" height="930" fill="white"/><style>text{font-family:'Malgun Gothic','Segoe UI',sans-serif;fill:#172538;font-weight:650}.note{fill:#526780}.heading{fill:#2355de;font-weight:750}.edge{fill:none;stroke:#2355de;stroke-width:2.5;marker-end:url(#arrow)}</style>
<rect x="250" y="40" width="460" height="112" rx="56" fill="#f8fafc" stroke="#c5d2e6" stroke-width="2"/>
<text x="480" y="86.38" text-anchor="middle" class="" font-size="26"><tspan x="480" dy="0">Wallet 결제 실패 응답</tspan><tspan x="480" dy="37.699999999999996">최상위 error_code · error_message</tspan></text>
<path d="M480 152 V190 H245 V222 M480 190 H720 V222" fill="none" stroke="#2355de" stroke-width="2.5"/>
<text x="245" y="262" text-anchor="middle" class="heading" font-size="28"><tspan x="245" dy="0">변경 전</tspan></text>
<text x="720" y="262" text-anchor="middle" class="heading" font-size="28"><tspan x="720" dy="0">변경 후</tspan></text>
<path d="M480 236 V886" stroke="#dce3ed" stroke-width="2" stroke-dasharray="7 7"/>
<rect x="85" y="300" width="320" height="110" rx="10" fill="#f8fafc" stroke="#c5d2e6" stroke-width="2"/>
<text x="245" y="345.38" text-anchor="middle" class="" font-size="26"><tspan x="245" dy="0">성공 응답처럼</tspan><tspan x="245" dy="37.699999999999996">result 하위 객체로 접근</tspan></text>
<path class="edge" d="M245 410 L245 470"/>
<rect x="85" y="470" width="320" height="110" rx="10" fill="#fff3e6" stroke="#c5d2e6" stroke-width="2"/>
<text x="245" y="515.38" text-anchor="middle" class="" font-size="26"><tspan x="245" dy="0">오류 필드를</tspan><tspan x="245" dy="37.699999999999996">읽지 못하는 경로</tspan></text>
<path class="edge" d="M245 580 L245 640"/>
<rect x="85" y="640" width="320" height="96" rx="48" fill="#f8fafc" stroke="#c5d2e6" stroke-width="2"/>
<text x="245" y="678.38" text-anchor="middle" class="" font-size="26"><tspan x="245" dy="0">사용자에게</tspan><tspan x="245" dy="37.699999999999996">결제 오류 전달 불가</tspan></text>
<rect x="560" y="300" width="320" height="110" rx="10" fill="#f8fafc" stroke="#c5d2e6" stroke-width="2"/>
<text x="720" y="345.38" text-anchor="middle" class="" font-size="26"><tspan x="720" dy="0">최상위 JSON에서</tspan><tspan x="720" dy="37.699999999999996">오류 필드 읽기</tspan></text>
